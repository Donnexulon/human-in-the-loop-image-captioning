[project]
name = "human-in-the-loop-image-captioning"
version = "0.1.0"
description = "Reproducible BLIP image captioning with a local human-review workflow"
requires-python = ">=3.10,<3.14"
dependencies = [
  "datasets>=2.19.1",
  "fsspec[http]>=2023.1.0,<=2026.6.0",
  "gradio>=5,<6",
  "nltk>=3.9",
  "Pillow>=10,<12",
  "pycocoevalcap>=1.2",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
  "torch>=2.4",
  "torchvision",
  "transformers>=4.45,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
caption-review = "caption_review.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
